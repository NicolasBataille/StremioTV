name: StremioTV
options:
  bundleIdPrefix: com.nicolasbataille.stremiotv
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: NO
targets:
  # ────────────────────────────────────────────────────────────────
  # iPhone + iPad — application universelle native (touch)
  # ────────────────────────────────────────────────────────────────
  StremioTV-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Shared
      - Sources/iOS
    dependencies:
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
        codeSign: true
    info:
      path: Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: StremioTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Lumières Hue : accès au réseau local (pont Hue) + découverte Bonjour.
        NSLocalNetworkUsageDescription: "StremioTV pilote tes lumières Philips Hue pendant la lecture."
        NSBonjourServices:
          - _hue._tcp
    settings:
      base:
        PRODUCT_NAME: StremioTV
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasbataille.stremiotv
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"

  # ────────────────────────────────────────────────────────────────
  # Apple TV — application existante (télécommande / focus)
  # ────────────────────────────────────────────────────────────────
  StremioTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Shared
      - Sources/tvOS
    dependencies:
      - framework: Vendor/TVVLCKit.xcframework
        embed: true
        codeSign: true
    info:
      path: Sources/tvOS/Info.plist
      properties:
        CFBundleDisplayName: StremioTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasbataille.stremiotv.tv
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

  StremioTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    dependencies:
      - target: StremioTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasbataille.stremiotv.tv.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StremioTV.app/StremioTV"
        BUNDLE_LOADER: "$(TEST_HOST)"

  StremioTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - UITests
    dependencies:
      - target: StremioTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasbataille.stremiotv.tv.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StremioTV

schemes:
  StremioTV:
    build:
      targets:
        StremioTV: all
        StremioTVTests: [test]
        StremioTVUITests: [test]
    test:
      targets:
        - StremioTVTests
        - StremioTVUITests
      gatherCoverageData: true

  StremioTV-iOS:
    build:
      targets:
        StremioTV-iOS: all
